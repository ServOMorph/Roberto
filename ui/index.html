<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Macrodesk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">AUTOMATISATION LOCALE</p>
          <h1>Macrodesk</h1>
        </div>
        <span id="status-dot" class="status-dot"></span>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-label">PRÊT</span>
        <p id="status-message">Chargement…</p>
      </section>

      <section class="hotkeys">
        <div><kbd>F8</kbd><span>Lancer</span></div>
        <div><kbd>F9</kbd><span>Arrêter</span></div>
      </section>

      <section class="mode-panel">
        <p class="section-label">ACTION F8</p>
        <div class="mode-buttons">
          <button id="record-mode" class="mode active">Enregistrer</button>
          <button id="play-mode" class="mode">Lire la sélection</button>
        </div>
        <label class="toggle">
          <input id="record-moves" type="checkbox" checked />
          <span>Enregistrer les déplacements souris</span>
        </label>
        <p id="mode-help" class="muted"></p>
      </section>

      <section class="library">
        <div class="section-heading">
          <p class="section-label">MACROS</p>
          <button id="new-macro" class="text-button">+ Nouvelle</button>
        </div>
        <div id="macro-list" class="macro-list"></div>
      </section>

      <section id="detail" class="detail hidden">
        <p class="section-label">SÉLECTION</p>
        <input id="macro-name" type="text" maxlength="60" />
        <div class="detail-actions">
          <button id="save-name" class="secondary">Renommer</button>
          <button id="delete-macro" class="danger">Supprimer</button>
        </div>
      </section>

      <footer>Les entrées effectuées ici ne sont jamais enregistrées.</footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
