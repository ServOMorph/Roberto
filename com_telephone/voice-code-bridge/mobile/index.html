<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Code Bridge</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-alt: #1a1d24;
    --fg: #e6e6e6;
    --muted: #8a8f98;
    --accent: #3b82f6;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid #22252c;
    flex-shrink: 0;
  }
  #connDot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--err);
    flex-shrink: 0;
  }
  #connDot.connected { background: var(--ok); }
  #stateLabel {
    margin-left: auto;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 11px;
  }
  #resetBtn {
    background: none;
    border: 1px solid #2c303a;
    border-radius: 999px;
    padding: 4px 10px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  #resetBtn:active { opacity: 0.7; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--bg-alt);
    color: var(--fg);
    border-bottom-left-radius: 4px;
  }
  .bubble.assistant.thinking {
    color: var(--muted);
    font-style: italic;
  }

  form#composer {
    display: flex;
    gap: 6px;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid #22252c;
    flex-shrink: 0;
  }
  #textInput {
    flex: 1;
    min-width: 0;
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
  }
  #sendBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn:active { opacity: 0.7; }
  #sendBtn:disabled { opacity: 0.4; }

  #micBtn {
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #micBtn:active { opacity: 0.7; }

  #imgBtn {
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #imgBtn:active { opacity: 0.7; }

  #statusBtn {
    background: var(--bg-alt);
    color: var(--fg);
    border: 1px solid #2c303a;
    border-radius: 999px;
    width: 40px;
    height: 40px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #statusBtn:active { opacity: 0.7; }

  .bubble.user img {
    max-width: 100%;
    border-radius: 10px;
    display: block;
  }

  .bubbleStatus {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.7);
  }

  #voiceScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    z-index: 50;
  }
  #voiceScreen.active { display: flex; }

  .voiceCircle {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2447c9, #0b1440 70%);
    box-shadow: 0 0 60px 20px rgba(37, 99, 235, 0.55), 0 0 120px 60px rgba(37, 99, 235, 0.25);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .voiceCircle.paused {
    animation: none;
    box-shadow: 0 0 40px 10px rgba(138, 143, 152, 0.35);
    background: radial-gradient(circle at 35% 30%, #4b5563, #1f2937 70%);
  }
  .voiceCircle.done {
    animation: none;
    box-shadow: 0 0 60px 20px rgba(34, 197, 94, 0.55), 0 0 120px 60px rgba(34, 197, 94, 0.25);
    background: radial-gradient(circle at 35% 30%, #16a34a, #052e16 70%);
  }
  .voiceCircle.thinking {
    box-shadow: 0 0 60px 20px rgba(249, 115, 22, 0.55), 0 0 120px 60px rgba(249, 115, 22, 0.25);
    background: radial-gradient(circle at 35% 30%, #ea580c, #431407 70%);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  #voiceStatus {
    color: var(--fg);
    font-size: 16px;
    text-align: center;
    padding: 0 32px;
    min-height: 24px;
  }

  #voiceCancel {
    background: var(--bg-alt);
    border: 1px solid #2c303a;
    border-radius: 999px;
    padding: 10px 16px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }

  #voiceControls {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
  }

  #validationBar {
    display: none;
    justify-content: center;
    gap: 12px;
    padding: 6px 12px;
    border-top: 1px solid #22252c;
    flex-shrink: 0;
  }
  #validationBar.visible { display: flex; }
  .validationBtn {
    border: 1px solid #2c303a;
    background: var(--bg-alt);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .validationBtn.ok { color: var(--ok); border-color: #1d4a2b; }
  .validationBtn.corriger { color: var(--err); border-color: #55232a; }

  #voiceValidation {
    position: absolute;
    left: 24px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #voiceValidation.visible { display: flex; }
  #voiceValidation .validationBtn {
    background: rgba(26, 29, 36, 0.85);
  }

  #modeBtn {
    background: var(--bg-alt);
    border: 1px solid #2c303a;
    border-radius: 999px;
    padding: 10px 16px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
  }

  #micHold {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: var(--bg-alt);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  #micHold.armed {
    background: var(--err);
    color: #fff;
    box-shadow: 0 0 24px 6px rgba(239, 68, 68, 0.45);
  }
  #micHold.recording {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 24px 6px rgba(59, 130, 246, 0.45);
  }
</style>
</head>
<body>

  <header>
    <span id="connDot"></span>
    <span id="connLabel">Déconnecté</span>
    <span id="stateLabel"></span>
    <button id="resetBtn" type="button">Reset</button>
  </header>

  <div id="chat"></div>

  <div id="validationBar">
    <button id="validBtn" class="validationBtn ok" type="button">✓ Validé</button>
    <button id="corrBtn" class="validationBtn corriger" type="button">✗ Corrigé</button>
  </div>

  <form id="composer">
    <input id="textInput" type="text" placeholder="Écrire un message..." autocomplete="off">
    <input id="imgInput" type="file" accept="image/*" hidden>
    <button id="imgBtn" type="button" aria-label="Image">img</button>
    <button id="statusBtn" type="button" aria-label="Statut">?</button>
    <button id="micBtn" type="button">mic</button>
    <button id="sendBtn" type="submit">-></button>
  </form>

  <div id="voiceScreen">
    <div class="voiceCircle" id="voiceCircle"></div>
    <div id="voiceStatus">Je vous écoute...</div>
    <div id="voiceValidation">
      <button id="voiceValidBtn" class="validationBtn ok" type="button">✓ Validé</button>
      <button id="voiceCorrBtn" class="validationBtn corriger" type="button">✗ Corrigé</button>
    </div>
    <div id="voiceControls">
      <button id="voiceCancel" type="button">Chat</button>
      <button id="modeBtn" type="button">Auto</button>
      <button id="micHold" type="button" aria-label="Micro">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/>
          <path d="M17.3 11a5.5 5.5 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-1.7z"/>
        </svg>
      </button>
    </div>
  </div>

  <audio id="assistantAudio" playsinline style="display:none"></audio>

  <script src="app.js"></script>
</body>
</html>
